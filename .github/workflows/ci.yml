name: CI

# Runs the unit tests and the typecheck of the TAD modules. It does not build an APK:
# that needs the owner's signing keystore, Firebase config and licence keys (see docs/BUILD_ANDROID.md).

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
            - name: Activate Yarn 3.6.4
              run: |
                  corepack enable
                  corepack prepare yarn@3.6.4 --activate
            - name: Install
              run: yarn install --immutable
            - name: Typecheck (TAD platform modules)
              run: yarn typecheck
            - name: Unit tests
              run: yarn test --ci
